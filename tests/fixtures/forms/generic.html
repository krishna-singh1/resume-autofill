<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Generic application form</title>
  <style>
    body { font-family: sans-serif; max-width: 720px; margin: 24px auto; }
    label, legend { display: block; margin-top: 12px; font-weight: 600; }
    input, select, textarea { display: block; width: 100%; padding: 6px; }
    fieldset { margin-top: 20px; }
    .field { margin-top: 12px; }
    .field span.lbl { display: block; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Apply for Senior Engineer</h1>
  <form id="app" onsubmit="return false">

    <h2>About you</h2>
    <label for="fn">First Name *</label>
    <input id="fn" name="candidate_first" />

    <label for="ln">Last Name *</label>
    <input id="ln" name="candidate_last" />

    <!-- label resolved via wrapping <label> -->
    <label>Email Address <input type="email" name="email_addr" /></label>

    <!-- confirm field must be left alone -->
    <label>Confirm Email Address <input type="email" name="email_confirm" /></label>

    <!-- label resolved via aria-label only -->
    <input type="tel" name="p" aria-label="Phone Number" />

    <!-- label resolved via single-control ancestor -->
    <div class="field">
      <span class="lbl">City</span>
      <input name="loc_city" />
    </div>

    <label for="country">Country</label>
    <select id="country" name="country">
      <option value="">Select…</option>
      <option value="CA">Canada</option>
      <option value="IN">India</option>
      <option value="US">United States of America</option>
    </select>

    <label for="li">LinkedIn Profile</label>
    <input id="li" name="li" type="url" />

    <label for="web">Company website (do not fill)</label>
    <input id="web" name="company_website" type="url" />

    <fieldset>
      <legend>Work Experience</legend>
      <label for="c1">Company</label><input id="c1" name="exp[0][company]" />
      <label for="t1">Title</label><input id="t1" name="exp[0][title]" />
      <label for="s1">Start date</label><input id="s1" name="exp[0][start]" type="month" />
      <hr />
      <label for="c2">Company</label><input id="c2" name="exp[1][company]" />
      <label for="t2">Title</label><input id="t2" name="exp[1][title]" />
      <label for="s2">Start date</label><input id="s2" name="exp[1][start]" type="month" />
    </fieldset>

    <fieldset>
      <legend>Education</legend>
      <label for="school">School</label><input id="school" name="edu_school" />
      <label for="degree">Degree</label><input id="degree" name="edu_degree" />
    </fieldset>

    <fieldset>
      <legend>Are you legally authorized to work in the United States?</legend>
      <label><input type="radio" name="auth" value="yes" /> Yes</label>
      <label><input type="radio" name="auth" value="no" /> No</label>
    </fieldset>

    <fieldset>
      <legend>Will you now or in the future require sponsorship?</legend>
      <label><input type="radio" name="sponsor" value="y" /> Yes</label>
      <label><input type="radio" name="sponsor" value="n" /> No</label>
    </fieldset>

    <label for="avail">Available start date</label>
    <input id="avail" name="avail" type="date" />

    <label for="cover">Cover Letter</label>
    <textarea id="cover" name="cover"></textarea>

    <label for="resume">Resume/CV</label>
    <input id="resume" name="resume" type="file" />

    <label for="tz">Which time zone are you in?</label>
    <input id="tz" name="custom_q_1" />

    <label for="colour">Favourite colour</label>
    <input id="colour" name="custom_q_2" />

    <fieldset>
      <legend>Gender</legend>
      <label><input type="radio" name="gender" value="f" /> Female</label>
      <label><input type="radio" name="gender" value="m" /> Male</label>
      <label><input type="radio" name="gender" value="d" /> Decline to self-identify</label>
    </fieldset>

    <button type="submit">Submit application</button>
  </form>
</body>
</html>
