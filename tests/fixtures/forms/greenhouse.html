<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Greenhouse-style application</title>
</head>
<body>
  <!-- Markup mirrors boards.greenhouse.io: labels are generic, ids are the stable hook. -->
  <form id="application_form" onsubmit="return false">
    <div class="field">
      <label for="first_name">First Name <span class="asterisk">*</span></label>
      <input id="first_name" name="job_application[first_name]" type="text" />
    </div>
    <div class="field">
      <label for="last_name">Last Name <span class="asterisk">*</span></label>
      <input id="last_name" name="job_application[last_name]" type="text" />
    </div>
    <div class="field">
      <label for="email">Email <span class="asterisk">*</span></label>
      <input id="email" name="job_application[email]" type="text" />
    </div>
    <div class="field">
      <label for="phone">Phone</label>
      <input id="phone" name="job_application[phone]" type="text" />
    </div>
    <div class="field">
      <label for="job_application_location">Location (City)</label>
      <input id="job_application_location" name="job_application[location]" type="text" />
    </div>
    <div class="field">
      <label for="resume">Resume/CV</label>
      <input id="resume" name="job_application[resume]" type="file" />
    </div>
    <div class="field">
      <label for="job_application_answers_attributes_0_text_value">LinkedIn Profile</label>
      <input id="job_application_answers_attributes_0_text_value" name="job_application[answers_attributes][0][text_value]" type="text" />
    </div>
    <div class="field">
      <label for="job_application_answers_attributes_1_text_value">Website</label>
      <input id="job_application_answers_attributes_1_text_value" name="job_application[answers_attributes][1][text_value]" type="text" />
    </div>
    <div class="field">
      <label for="job_application_answers_attributes_2_boolean_value">Are you legally authorized to work in the United States?</label>
      <select id="job_application_answers_attributes_2_boolean_value" name="job_application[answers_attributes][2][boolean_value]">
        <option value=""></option>
        <option value="1">Yes</option>
        <option value="0">No</option>
      </select>
    </div>
    <input type="submit" value="Submit Application" />
  </form>
</body>
</html>
