<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Senior Backend Engineer — Northwind Careers</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1f2937; background: #f3f4f6; }
    header { background: #111827; color: #fff; padding: 14px 32px; display: flex; align-items: center; gap: 10px; font-weight: 700; }
    header .logo { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, #f59e0b, #ef4444); }
    main { max-width: 820px; margin: 22px auto; background: #fff; border-radius: 10px; padding: 26px 32px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    h1 { font-size: 21px; margin: 0 0 2px; }
    .meta { color: #6b7280; margin-bottom: 18px; }
    h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .05em; color: #6b7280; margin: 20px 0 8px; border-top: 1px solid #e5e7eb; padding-top: 16px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
    label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; }
    input, select, textarea { width: 100%; font: inherit; padding: 7px 9px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; }
    textarea { min-height: 58px; }
    .radios { display: flex; gap: 16px; font-weight: 400; }
    .radios label { font-weight: 400; display: flex; gap: 6px; align-items: center; }
    .radios input { width: auto; }
    fieldset { border: 0; padding: 0; margin: 0; }
    legend { font-weight: 600; font-size: 13px; margin-bottom: 4px; padding: 0; }
    .q { margin-top: 10px; }
  </style>
</head>
<body>
  <header><span class="logo"></span> Northwind Careers</header>
  <main>
    <h1>Senior Backend Engineer</h1>
    <div class="meta">Payments Platform · Austin, TX or Remote</div>
    <form onsubmit="return false">
      <div class="grid">
        <div><label for="fn">First name *</label><input id="fn" name="first_name" /></div>
        <div><label for="ln">Last name *</label><input id="ln" name="last_name" /></div>
        <div><label for="em">Email *</label><input id="em" name="email" type="email" /></div>
        <div><label for="ph">Phone *</label><input id="ph" name="phone" type="tel" /></div>
        <div><label for="city">City</label><input id="city" name="city" /></div>
        <div><label for="li">LinkedIn profile</label><input id="li" name="linkedin" /></div>
        <div><label for="cv">Resume / CV *</label><input id="cv" name="resume" type="file" /></div>
        <div><label for="gh">GitHub</label><input id="gh" name="github" /></div>
      </div>

      <h2>Work experience</h2>
      <div class="grid">
        <div><label for="co">Current company</label><input id="co" name="company" /></div>
        <div><label for="ti">Current title</label><input id="ti" name="title" /></div>
      </div>

      <h2>A few questions</h2>
      <fieldset class="q">
        <legend>Are you legally authorized to work in the United States? *</legend>
        <div class="radios"><label><input type="radio" name="auth" value="y" /> Yes</label><label><input type="radio" name="auth" value="n" /> No</label></div>
      </fieldset>
      <fieldset class="q">
        <legend>Will you now or in the future require visa sponsorship? *</legend>
        <div class="radios"><label><input type="radio" name="spon" value="y" /> Yes</label><label><input type="radio" name="spon" value="n" /> No</label></div>
      </fieldset>
      <div class="grid q">
        <div><label for="tz">Which time zone are you in?</label><input id="tz" name="q_tz" /></div>
        <div><label for="tr">Are you comfortable with 20% travel?</label><input id="tr" name="q_travel" /></div>
      </div>
    </form>
  </main>
</body>
</html>
